[package]
name = "recharts_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "=0.5.5", default-features = false, features = ["api-4-3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"

